<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M7 20h10'/><path d='M10 20c0-4 1.5-7 4-9'/><path d='M14 20c0-6-2.5-11-7-14'/><path d='M17 20c0-3 .5-5 2-7'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="TrailWhisper — 100% Offline Edge Nature & Audio Field Guide powered by Open-Source AI. Designed to get you off the screen and into the wild." />
    <meta name="theme-color" content="#07100b" />
    <title>TrailWhisper — Offline Edge Nature Guide & Audio Naturalist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      const _origFetch = window.fetch;
      window.fetch = async function(...args) {
        const url = typeof args[0] === 'string' ? args[0] : (args[0]?.url || '');
        try {
          const res = await _origFetch.apply(this, args);
          const ct = res.headers.get('content-type') || '';
          if (ct.includes('text/html') && !url.endsWith('.html') && url !== '/' && !url.includes('?html-proxy')) {
            console.error('[VITE_HTML_TRAP] URL requested that returned HTML:', url, 'Full args:', args);
          }
          return res;
        } catch (err) {
          console.error('[FETCH_ERROR]', url, err);
          throw err;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
